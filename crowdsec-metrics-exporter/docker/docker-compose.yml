services:
  crowdsec-metrics-exporter:
    image: giiibates/crowdsec-toolbox:metrics-exporter-latest
    container_name: crowdsec-metrics-exporter
    env_file:
      - ./settings.env
    restart: always
    stop_grace_period: 2m
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    volumes:
      - /etc/hostname:/run/host/hostname:ro
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m,mode=1777

networks:
  default:
    driver: bridge
