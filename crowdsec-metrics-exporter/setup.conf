python3 -m venv /opt/jobs/crowdsec_influx
source /opt/jobs/crowdsec_influx/bin/activate

pip install --upgrade pip
pip install --group $(cd /opt/crowdsec-toolbox/crowdsec-metrics-exporter && pwd)/pyproject.toml:default

# Docker Build
PROJECT="crowdsec-metrics-exporter" && \
cd /opt/crowdsec-toolbox && \
VERSION="$(python3 -c 'import tomllib; print(tomllib.load(open("crowdsec-metrics-exporter/pyproject.toml", "rb"))["project"]["version"])')" && \
GIT_SHA="$(git rev-parse --verify HEAD)" && \
BUILD_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)" && \
printf 'APP_VERSION=%s\nGIT_SHA=%s\nBUILD_DATE=%s\n' "$VERSION" "$GIT_SHA" "$BUILD_DATE" > "${PROJECT}/BUILD_INFO" && \
docker buildx build \
  --platform linux/amd64 \
  --pull \
  -f "${PROJECT}/docker/Dockerfile" \
  --build-arg APP_VERSION="$VERSION" \
  --build-arg GIT_SHA="$GIT_SHA" \
  --build-arg BUILD_DATE="$BUILD_DATE" \
  -t "docker.cirrio.de/${PROJECT}:latest" \
  --push .