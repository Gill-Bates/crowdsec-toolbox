#
# .github/workflows/ci.yml
#
# The PR gate: the check standing between a broken commit and main. Gates on
# ruff, pytest (the abuse-reporter's suite is the only one that exists), and
# the two Dockerfiles/entrypoints. Per-tool releases (release.yml) and image
# publishing to Docker Hub are handled separately; see
# docs/development/pipelines.md.
#

name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Ruff + pytest
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          # Matches requires-python in each tool's pyproject.toml.
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            crowdsec-abuse-reporter/pyproject.toml
            crowdsec-metrics-exporter/pyproject.toml

      # pip >= 25.1 is required for PEP 735 `--group` installs. There is no
      # root pyproject.toml any more (see AGENTS.md) - each tool owns its own
      # manifest with a `default` runtime group. ruff needs both installed to
      # resolve imports across the whole repository; pytest only needs the
      # abuse-reporter's dev group, since it is the only tool with a test
      # suite.
      - name: Install dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade "pip>=25.1"
          pip install --group crowdsec-abuse-reporter/pyproject.toml:default \
                      --group crowdsec-abuse-reporter/pyproject.toml:dev \
                      --group crowdsec-metrics-exporter/pyproject.toml:default \
                      --group crowdsec-metrics-exporter/pyproject.toml:dev

      - name: Ruff lint
        run: ruff check --output-format=github .

      # crowdsec-metrics-exporter has no test suite (see its AGENTS.md); only
      # crowdsec-abuse-reporter's tests/ exists and is the "only test suite"
      # per the root AGENTS.md.
      #
      # test_entrypoint_rejects_non_integer_run_jitter executes
      # docker/entrypoint.sh, which execs into `gosu app:app` — a user the
      # container image creates but the runner does not have. Its documented
      # baseline is 114 passed, 1 failed for exactly this reason (see
      # crowdsec-abuse-reporter/tests/AGENTS.md); installing `gosu` alone does
      # not close the gap, since the entrypoint then fails one step later on
      # the missing `app` user. Deselecting it here keeps the gate meaningful
      # instead of permanently red for an environmental, already-documented
      # case; any other failure in the class still fails the build.
      - name: pytest (crowdsec-abuse-reporter)
        working-directory: crowdsec-abuse-reporter
        run: >-
          python -m pytest --deselect
          "crowdsec-abuse-reporter/tests/test_hardening.py::EntrypointHardeningTest::test_entrypoint_rejects_non_integer_run_jitter"

  container:
    name: Dockerfiles + entrypoints
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        project:
          - crowdsec-abuse-reporter
          - crowdsec-metrics-exporter

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      # entrypoint.sh runs as bash (its shebang) and uses bash-only syntax.
      # -n parses without executing, catching a typo well before the next
      # manual `docker buildx build ... --push` in setup.conf.
      - name: Entrypoint shell syntax
        run: bash -n "${{ matrix.project }}/docker/entrypoint.sh"

      # BuildKit's own linter: resolves stages, ARG/ENV references and
      # COPY --from targets without running a single build step. Build
      # context is the repository root, matching setup.conf.
      - name: Dockerfile check
        run: docker build --check -f "${{ matrix.project }}/docker/Dockerfile" .

  manifest:
    name: each tool's pyproject.toml is its only manifest
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      # A per-tool requirements.txt would give the manual build in setup.conf
      # and the tool's own pyproject.toml two dependency sets to disagree
      # about. There is no root pyproject.toml any more - each tool owns its
      # manifest independently (see AGENTS.md). BUILD_INFO is generated by
      # setup.conf itself and is gitignored; it should never be committed.
      # docs/license.md is generated from the root LICENSE by docs-build.yml,
      # so a committed copy would go stale silently.
      - name: Reject reintroduced manifests
        run: |
          set -euo pipefail
          failed=0
          for stale in \
            pyproject.toml \
            crowdsec-abuse-reporter/requirements.txt \
            crowdsec-metrics-exporter/requirements.txt \
            docs/requirements-docs.txt \
            docs/license.md \
            crowdsec-abuse-reporter/BUILD_INFO \
            crowdsec-metrics-exporter/BUILD_INFO
          do
            if [ -e "$stale" ]; then
              echo "ERROR: $stale is back - each tool's own pyproject.toml is its single manifest"
              failed=1
            fi
          done
          [ "$failed" -eq 0 ]

      - name: Version is release-shaped
        run: |
          set -euo pipefail
          for project in crowdsec-abuse-reporter crowdsec-metrics-exporter; do
            VERSION="$(python3 -c 'import tomllib; print(tomllib.load(open("'"${project}"'/pyproject.toml", "rb"))["project"]["version"])')"
            echo "${project}/pyproject.toml version: ${VERSION}"
            echo "$VERSION" | grep -qE '^[0-9]+\.[0-9]+(\.[0-9]+)?(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$'
          done
