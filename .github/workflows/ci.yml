#
# .github/workflows/ci.yml
# Purpose: PR and push gate (lint, tests, manifest invariants, Dockerfile and workflow
#   checks, source secret scan). release.yml calls it as the release gate.
# Related: release.yml (release), docs-build.yml (Pages); docs/development/pipelines.md.
#

name: CI
run-name: ci-${{ github.run_number }}

# One definition of the gate: runs on every branch push and pull request, and the
# release workflow calls it so a release is gated by exactly the same checks.
on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - main
  workflow_dispatch:
  workflow_call:
    secrets:
      # Read access to the private Gill-Bates/python-libraries repository (see pipelines.md).
      RELEASE_TOKEN:
        required: true

permissions:
  contents: read

# Only a pull request run is cancellable: a push run is the gate result a release
# reads, so a newer push must not cancel it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Seconds-cheap checks that need no dependency install run beside the test job
  # and fail the run early; parallel on purpose, a PR gate has no irreversible step.
  manifest:
    name: each tool's pyproject.toml is its only manifest
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      # Before the banner: the helper scripts need the requires-python interpreter.
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.14'
      # The helper lives in the repository, so the checkout has to come first. It prints
      # the agent banner and points TMPDIR, TMP and TEMP at the job temp directory.
      - name: Agent banner and job temp directory
        run: python3 .github/scripts/ci_job_setup.py

      # A per-tool requirements.txt would give the manual build in the root setup.conf and the
      # tool's own pyproject.toml two dependency sets to disagree about. There is no root
      # pyproject.toml (see AGENTS.md). BUILD_INFO is no longer generated anywhere and is
      # gitignored. docs/license.md is generated by docs-build.yml, so a committed copy
      # would go stale silently.
      - name: Reject reintroduced manifests
        run: |
          set -euo pipefail
          failed=0
          # Any tracked path, not only the tool roots, so a stray requirements.txt fails too.
          while IFS= read -r stale; do
            echo "::error::$stale is obsolete; each tool's own pyproject.toml is its single manifest"
            failed=1
          done < <(git ls-files -- ':(glob)**/requirements*.txt' ':(glob)**/BUILD_INFO')
          for stale in pyproject.toml docs/license.md; do
            if [ -e "$stale" ]; then
              echo "::error::$stale must not exist in the repository"
              failed=1
            fi
          done
          [ "$failed" -eq 0 ]

      # A bad version has to fail here, before the tag is pushed: a pushed tag is not
      # retractable like a commit. release.yml additionally requires both to equal the tag.
      - name: Version is release-shaped
        run: |
          set -euo pipefail
          for project in crowdsec-abuse-reporter crowdsec-metrics-exporter; do
            VERSION="$(python3 -c 'import sys, tomllib; print(tomllib.load(open(sys.argv[1], "rb"))["project"]["version"])' "${project}/pyproject.toml")"
            echo "${project}/pyproject.toml version: ${VERSION}"
            echo "$VERSION" | grep -qE '^[0-9]+\.[0-9]+(\.[0-9]+)?(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$'
          done

      - name: Test Trivy report evidence
        run: python3 .github/scripts/test_trivy_report.py

      - name: Test release tag promotion
        run: python3 .github/scripts/test_release_tags.py

      - name: Test CI helper scripts
        run: |
          set -euo pipefail
          python3 .github/scripts/test_ci_helpers.py
          python3 .github/scripts/test_failure_issue.py
          python3 .github/scripts/test_shared_code.py
          node --test .github/scripts/test_release_publish.cjs

  workflows:
    name: Workflow lint (actionlint + shellcheck)
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      # Before the banner: the helper scripts need the requires-python interpreter.
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.14'
      - name: Agent banner and job temp directory
        run: python3 .github/scripts/ci_job_setup.py

      # actionlint runs shellcheck over every inline `run:` block when the binary is
      # on PATH and silently skips it otherwise. Failing here keeps that half of the
      # gate from disappearing unnoticed with a runner image.
      - name: shellcheck is available
        run: command -v shellcheck && shellcheck --version

      # Exact release plus its published sha256 keeps workflow lint repeatable.
      - name: Install actionlint
        env:
          # renovate: datasource=github-releases depName=rhysd/actionlint
          ACTIONLINT_VERSION: "1.7.12"
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSL --proto '=https' --tlsv1.2 -o "$archive" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  ${archive}" | sha256sum --check --strict
          tar -xzf "$archive" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -version

      - name: actionlint
        run: '"$RUNNER_TEMP/actionlint" -color'

  zizmor:
    name: Workflow security lint (zizmor)
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      # Before the banner: the helper scripts need the requires-python interpreter.
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.14'
      - name: Agent banner and job temp directory
        run: python3 .github/scripts/ci_job_setup.py

      # Exact PyPI release: zizmor complements actionlint with unpinned actions, template
      # injection and over-broad permissions. Reads .github/zizmor.yml.
      - name: Install zizmor
        env:
          # renovate: datasource=pypi depName=zizmor
          ZIZMOR_VERSION: "1.32.0"
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/zizmor"
          "$RUNNER_TEMP/zizmor/bin/pip" install --quiet --disable-pip-version-check "zizmor==${ZIZMOR_VERSION}"

      # The token only enables zizmor's online audits (known-vulnerable actions, impostor
      # commits); it is read-only.
      - name: zizmor
        env:
          GH_TOKEN: ${{ github.token }}
        run: '"$RUNNER_TEMP/zizmor/bin/zizmor" --no-progress --format=github .github/workflows'

  container:
    name: Dockerfile + entrypoint (${{ matrix.project }})
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        project:
          - crowdsec-abuse-reporter
          - crowdsec-metrics-exporter

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      # Before the banner: the helper scripts need the requires-python interpreter.
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.14'
      - name: Agent banner and job temp directory
        run: python3 .github/scripts/ci_job_setup.py

      # The images are only built from a release tag, so without these steps a broken
      # entrypoint or Dockerfile stays invisible until the release itself. The full
      # multi-arch build is too slow for a PR; this is the cheap half that still
      # catches a typo. -n parses a script without executing it.
      - name: Entrypoint shell syntax
        env:
          PROJECT: ${{ matrix.project }}
        run: bash -n "${PROJECT}/docker/entrypoint.sh"

      - name: Entrypoint shellcheck
        env:
          PROJECT: ${{ matrix.project }}
        run: shellcheck "${PROJECT}/docker/entrypoint.sh"

      # BuildKit checks stages and COPY targets without running the build. The build
      # context is the repository root, matching the root setup.conf.
      - name: Dockerfile check
        env:
          PROJECT: ${{ matrix.project }}
        run: docker build --check -f "${PROJECT}/docker/Dockerfile" .

  # ruff and pytest are independent, so they run as parallel legs instead of one
  # sequential job. Each leg installs the same environment.
  check:
    name: Check (${{ matrix.check }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        check: [ruff, pytest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      # Before the banner: the helper scripts need the requires-python interpreter too.
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          # Matches requires-python in each tool's pyproject.toml.
          python-version: '3.14'
          cache: pip
          cache-dependency-path: |
            crowdsec-abuse-reporter/pyproject.toml
            crowdsec-metrics-exporter/pyproject.toml
      - name: Agent banner and job temp directory
        run: python3 .github/scripts/ci_job_setup.py

      # pip >= 25.1 is required for PEP 735 `--group` installs. ruff needs both tools
      # installed to resolve imports across the repository; pytest runs both suites.
      # [project].dependencies (gillbates-logging, gillbates-questdb-client, gillbates-smtp-client and gillbates-shutdown-handler, private git dependencies) is not part of a
      # group, so it is collected into a requirements file. The token reaches git only through
      # a credential helper that reads it from this step's environment; it is never part of a
      # URL or written to disk. Every failure (missing token, empty list, install, import) fails
      # the step.
      - name: Install dependencies
        env:
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          : "${RELEASE_TOKEN:?Missing RELEASE_TOKEN secret (not available to pull requests from forks)}"
          python -m pip install --upgrade "pip>=25.1"
          requirements="$RUNNER_TEMP/runtime-requirements.txt"
          : > "$requirements"
          for project in crowdsec-abuse-reporter crowdsec-metrics-exporter; do
            python -c 'import sys, tomllib; deps = tomllib.load(open(sys.argv[1], "rb"))["project"]["dependencies"]; deps or sys.exit("no [project].dependencies in " + sys.argv[1]); print(*deps, sep="\n")' "${project}/pyproject.toml" >> "$requirements"
          done
          test -s "$requirements"
          # The empty first helper resets any helper configured on the runner, so only ours answers.
          export GIT_TERMINAL_PROMPT=0 GIT_CONFIG_COUNT=2 GIT_CONFIG_KEY_0=credential.helper GIT_CONFIG_VALUE_0=
          export GIT_CONFIG_KEY_1=credential.helper
          # shellcheck disable=SC2016 # expanded by git's helper shell at call time, not here
          export GIT_CONFIG_VALUE_1='!f() { echo username=x-access-token; echo "password=${RELEASE_TOKEN}"; }; f'
          pip install -r "$requirements" \
                      --group crowdsec-abuse-reporter/pyproject.toml:default \
                      --group crowdsec-abuse-reporter/pyproject.toml:dev \
                      --group crowdsec-metrics-exporter/pyproject.toml:default \
                      --group crowdsec-metrics-exporter/pyproject.toml:dev
          python -c "import gillbates_logging, gillbates_questdb_client, gillbates_smtp_client, gillbates_shutdown_handler"

      - name: Run ruff
        if: matrix.check == 'ruff'
        run: ruff check --output-format=github .

      # The tree is formatted with `ruff format`; a check never rewrites files.
      - name: Run ruff format
        if: matrix.check == 'ruff'
        run: ruff format --check --diff .

      - name: Run tests (crowdsec-abuse-reporter)
        if: matrix.check == 'pytest'
        working-directory: crowdsec-abuse-reporter
        run: python -m pytest

      - name: Run tests (crowdsec-metrics-exporter)
        if: matrix.check == 'pytest'
        working-directory: crowdsec-metrics-exporter
        run: python -m pytest

  source-scan:
    name: Source secrets
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      # Before the banner: the helper scripts need the requires-python interpreter.
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.14'
      - name: Agent banner and job temp directory
        run: python3 .github/scripts/ci_job_setup.py

      # The release image scan owns vulnerabilities. This scans the source tree for
      # committed secrets. Trivy runs as the CLI instead of the action, because the gate
      # has to read the scanner log: the action's output is not available to a later step.
      - name: Install Trivy
        # Pinned to an immutable commit SHA, see GHSA-69fq-xp46-6x23.
        uses: aquasecurity/setup-trivy@3fb12ec12f41e471780db15c232d5dd185dcb514 # v0.2.6
        with:
          # renovate: datasource=github-releases depName=aquasecurity/trivy
          version: v0.70.0
          cache: true

      # Exit 0 even with findings: the verdict comes from the report in the next step, and
      # a scanner error still fails this step. Excluded paths are tooling and build output
      # that never ship: .git, virtualenvs, bytecode, the built docs site and tool caches.
      # Dockerfile misconfiguration is not scanned: the reporter image starts as root on
      # purpose (entrypoint drops to `app` through gosu), which Trivy reports as a HIGH finding.
      - name: Trivy source scan
        run: |
          set -euo pipefail
          trivy fs --scanners secret \
            --skip-dirs .git,.venv,venv,__pycache__,site,.pytest_cache,.ruff_cache \
            --severity CRITICAL,HIGH --ignorefile .trivyignore --timeout 5m \
            --skip-version-check --exit-code 0 \
            --format json --output "$RUNNER_TEMP/trivy-source.json" . \
            2>&1 | tee "$RUNNER_TEMP/trivy-source.log"

      # Fails on findings, on a missing or empty scan input, and on the scanner log
      # lines that mean a scan on nothing or on embedded rules.
      - name: Evaluate source scan report
        run: |
          set -euo pipefail
          python3 .github/scripts/trivy_report.py status "$RUNNER_TEMP/trivy-source.json" \
            --expect-class secret --input . \
            --log-file "$RUNNER_TEMP/trivy-source.log" --fail-on-findings \
            --summary-title "Trivy (source)" --list 20 >> "$GITHUB_STEP_SUMMARY"
