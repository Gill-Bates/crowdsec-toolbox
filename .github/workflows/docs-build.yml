#
# .github/workflows/docs-build.yml
#
# Builds the central documentation site in docs/ and deploys it to GitHub Pages.
# Unlike the sibling projects this repository has no tools/pyproject-deps.py: the
# docs toolchain is a PEP 735 dependency group, which pip installs straight from
# docs/pyproject.toml with `--group`. There is no root manifest - every component
# owns its own (see AGENTS.md), and the docs site is one such component.
#

name: Deploy Documentation

on:
  push:
    branches:
      - main
    paths:
      - 'docs/**'
      - 'LICENSE'
      # The docs toolchain is the `default` group in docs/pyproject.toml, which
      # decides what this workflow builds and scans - a bump has to re-run it.
      # It is covered by the 'docs/**' pattern above; named here only to make the
      # dependency explicit.
      - 'docs/pyproject.toml'
      - '.github/workflows/docs-build.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'docs/**'
      - 'LICENSE'
      - 'docs/pyproject.toml'
      - '.github/workflows/docs-build.yml'
  workflow_dispatch:
  schedule:
    # Weekly re-scan: a new CVE in the docs dependencies would otherwise only
    # surface when something in the repository happens to change.
    - cron: '17 4 * * 1'

permissions:
  contents: read

# One concurrent deployment at a time.
concurrency:
  group: docs-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          # Full history for the git-revision-date-localized plugin, which reads
          # each page's commit dates.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          # Same interpreter as ci.yml and requires-python in each tool's
          # pyproject.toml.
          python-version: '3.13'
          cache: pip
          cache-dependency-path: docs/pyproject.toml

      # docs/pyproject.toml is the docs site's own manifest; its `default` group
      # is the toolchain. pip >= 25.1 is what reads PEP 735 groups.
      - name: Install dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade "pip>=25.1"
          pip install --group docs/pyproject.toml:default

      # There is no CHANGELOG.md in this repository, so only the license is
      # mirrored into the site. docs/license.md is generated, never committed.
      - name: Copy root files into docs
        run: cp LICENSE docs/license.md

      - name: Build documentation
        run: mkdocs build -f docs/mkdocs.yml --strict

      # Runs against the same build that gets deployed, so the revision-date
      # plugin saw the same history. img.shields.io is excluded because those
      # badges are generated on demand by a third party that throttles: a badge
      # answering 503 after lychee's retries says nothing about the
      # documentation, and blocking the Pages deploy on it only produces reruns.
      # x-arf.org (linked from abuse-reporter/index.md) has repeatedly timed out
      # in this same way, unrelated to any change here - same reasoning as
      # apps.apple.com in the wirebuddy repo's docs-build.yml.
      # The site's own Pages URL is excluded because it does not exist yet on the
      # very first deploy.
      - name: Check links
        uses: lycheeverse/lychee-action@v1
        with:
          args: >-
            --verbose
            --no-progress
            --exclude 'fonts\.gstatic\.com'
            --exclude 'img\.shields\.io'
            --exclude 'x-arf\.org'
            --exclude 'gill-bates\.github\.io/crowdsec-toolbox'
            './site/**/*.html'
          fail: true

      - name: Upload artifact
        if: |
          github.ref == 'refs/heads/main' &&
          (
            github.event_name == 'push' ||
            github.event_name == 'workflow_dispatch'
          )
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./site

  security-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      # Trivy reports on what a manifest names, and the group names its five
      # direct dependencies only: mkdocs-material alone pulls in jinja2,
      # markupsafe, babel, requests, urllib3 and pygments, none of which appear
      # in docs/pyproject.toml. Scanning the group by itself would leave the
      # majority of the installed code unscanned. Installing it and freezing the
      # result gives the scanner the environment mkdocs is actually built in.
      #
      # The frozen file is a scan inventory, not an installation pin: the build
      # job resolves the group itself, and the direct dependencies are pinned in
      # docs/pyproject.toml, so the two environments agree on everything a pin
      # determines.
      - name: Materialise the docs environment for scanning
        run: |
          set -euo pipefail
          python3 -m venv .docs-scan
          .docs-scan/bin/python -m pip install --quiet --upgrade "pip>=25.1"
          .docs-scan/bin/python -m pip install --quiet --group docs/pyproject.toml:default
          # The name has to contain "requirement" or Trivy's pip analyzer does
          # not pick the file up at all.
          .docs-scan/bin/python -m pip freeze --all > docs-requirements-frozen.txt
          echo "Scanning $(grep -c '==' docs-requirements-frozen.txt) resolved packages:"
          cat docs-requirements-frozen.txt

      - name: Trivy scan docs dependencies
        # Pinned to an immutable commit SHA - see GHSA-69fq-xp46-6x23.
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          # The action's default scanner version trails its own releases, and the
          # vulnerability database it reads is downloaded fresh on every run
          # regardless.
          version: 'latest'
          cache: 'false'
          scan-type: 'fs'
          # The frozen environment, not the manifest: see the step above.
          scan-ref: 'docs-requirements-frozen.txt'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'
          timeout: '5m'

  deploy:
    if: |
      github.ref == 'refs/heads/main' &&
      (
        github.event_name == 'push' ||
        github.event_name == 'workflow_dispatch'
      )
    # A failing dependency scan blocks the deploy, not just the build.
    needs:
      - build
      - security-scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
