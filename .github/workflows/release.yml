#
# .github/workflows/release.yml
#
# Publishes BOTH tools from a single repo-wide tag. This repository ships two
# tools into ONE Docker Hub repository (giiibates/crowdsec-toolbox), so the tool
# name has to live in the image tag:
#
#     crowdsec-toolbox:abuse-reporter-1.0.2    pinned
#     crowdsec-toolbox:abuse-reporter-latest   moving
#     crowdsec-toolbox:metrics-exporter-1.0.2  pinned
#     crowdsec-toolbox:metrics-exporter-latest moving
#
# A bare `latest` is deliberately never published: it could only mean one of
# the two tools, and silently picking one would ship the wrong image to anyone
# who omits the tag.
#
# The tag is the contract: vX.Y.Z releases BOTH tools and requires BOTH
# manifests (each tool's own pyproject.toml) to declare exactly that version.
# That keeps one git tag mapped to one reviewable state of the repository. This
# is the one place the two tools are not fully independent - if they ever need
# to ship separately, split this into per-tool tags.
#
# ci.yml gates main; this workflow gates tags, and a tag can be pushed from any
# commit. The meta job therefore re-establishes what a tag alone cannot prove, and the
# gate job runs ci.yml on the tagged commit before any image is built.
#

name: Release
run-name: release-${{ github.ref_name }}-${{ github.run_number }}

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# Never cancel a release in flight: a half-pushed manifest is worse than a slow
# one, and Docker Hub tag moves are not reversible.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  meta:
    name: Validate release metadata
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: release
    outputs:
      version: ${{ steps.meta.outputs.version }}
      build_date: ${{ steps.meta.outputs.build_date }}
      is_newest: ${{ steps.newest.outputs.is_newest }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          # Full history, so the main-ancestry check below can walk from the
          # tagged commit back to main.
          fetch-depth: 0
          persist-credentials: false
      # Before the banner: the helper scripts need the requires-python interpreter.
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.14'
      # The helper lives in the repository, so the checkout has to come first. It prints
      # the agent banner and points TMPDIR, TMP and TEMP at the job temp directory.
      - name: Agent banner and job temp directory
        run: python3 .github/scripts/ci_job_setup.py

      - name: Validate Docker Hub secrets
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -euo pipefail
          : "${DOCKERHUB_USERNAME:?Missing DOCKERHUB_USERNAME secret}"
          : "${DOCKERHUB_TOKEN:?Missing DOCKERHUB_TOKEN secret}"
          if ! echo "$DOCKERHUB_USERNAME" | grep -qE '^[a-z0-9][a-z0-9_-]{2,}$'; then
            echo "ERROR: invalid Docker Hub namespace: '$DOCKERHUB_USERNAME'"
            exit 1
          fi

      - name: Validate tag, versions and branch containment
        id: meta
        run: |
          set -euo pipefail
          # A release must run from the tag. A manual run on a branch could
          # otherwise republish an existing version from a different commit and
          # move the `-latest` tags with it. Re-runs stay possible: pick the tag
          # as the ref when dispatching.
          if [[ "$GITHUB_REF_TYPE" != "tag" ]]; then
            echo "ERROR: this workflow must run from a tag, but '${GITHUB_REF_NAME}' is a ${GITHUB_REF_TYPE}."
            exit 1
          fi
          VERSION="${GITHUB_REF_NAME#v}"
          if ! echo "$VERSION" | grep -qE '^[0-9]+\.[0-9]+(\.[0-9]+)?(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$'; then
            echo "ERROR: invalid version in tag '${GITHUB_REF_NAME}' (expected vX.Y, vX.Y.Z or either with -suffix)"
            exit 1
          fi
          # Both manifests must agree with the tag. Each tool's own
          # pyproject.toml is what app/version.py reads back at runtime, so a
          # mismatch here would ship an image that misreports its own version.
          failed=0
          for project in crowdsec-abuse-reporter crowdsec-metrics-exporter; do
            declared="$(python3 -c "import tomllib; print(tomllib.load(open('${project}/pyproject.toml','rb'))['project']['version'])" | tr -d '[:space:]')"
            echo "${project}: declares ${declared}"
            if [[ "$declared" != "$VERSION" ]]; then
              echo "ERROR: ${project}/pyproject.toml declares ${declared}, tag says ${VERSION}"
              failed=1
            fi
          done
          [[ "$failed" -eq 0 ]]
          # The tag checks above only prove the name agrees with the manifests,
          # not that the commit ever passed CI. Without this, a tag cut from an
          # unreviewed commit publishes to Docker Hub.
          git fetch --no-tags origin '+refs/heads/main:refs/remotes/origin/main'
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "ERROR: ${GITHUB_REF_NAME} points at ${GITHUB_SHA}, which is not contained in main."
            echo "Merge the release commit into main first, then tag that commit."
            exit 1
          fi
          {
            echo "version=${VERSION}"
            echo "build_date=$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          } >> "$GITHUB_OUTPUT"

      # A release must not travel backwards. Re-running an older tag passes
      # every check above, because that commit really does declare that version.
      # It would then move the `-latest` tags onto the older image. Both are
      # irreversible on Docker Hub, so the already-published tags decide.
      - name: Determine whether this is the newest release
        id: newest
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: python3 .github/scripts/release_tags.py newest

  # The same gate as a pull request, run on the tagged commit: no image is built from
  # code that failed lint, tests or the manifest invariants.
  gate:
    name: CI gate
    needs: meta
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  build:
    name: Build ${{ matrix.tool }} (${{ matrix.arch }})
    needs: [meta, gate]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    environment: release
    permissions:
      contents: read
    env:
      IMAGE_NAME: ${{ format('{0}/crowdsec-toolbox', secrets.DOCKERHUB_USERNAME) }}
      IMAGE_TAG: ${{ matrix.tool }}-${{ needs.meta.outputs.version }}-${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        # Both run on native runners rather than QEMU: these images install apt
        # packages and, for the abuse reporter, fetch two GeoLite2 databases, all
        # of which emulate poorly. tool x arch as two real axes, so GitHub
        # expands the full cartesian product (4 jobs) instead of `include`
        # entries that lack a `tool` key and therefore do not multiply against
        # it - that silently produced only one arch per tool.
        tool:
          - abuse-reporter
          - metrics-exporter
        arch:
          - amd64
          - arm64
        include:
          - arch: amd64
            runner: ubuntu-24.04
            platform: linux/amd64
          - arch: arm64
            runner: ubuntu-24.04-arm
            platform: linux/arm64
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      # Before the banner: the helper scripts need the requires-python interpreter.
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.14'
      - name: Agent banner and job temp directory
        run: python3 .github/scripts/ci_job_setup.py

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

      - name: Resolve project directory
        id: project
        env:
          TOOL: ${{ matrix.tool }}
        run: echo "name=crowdsec-${TOOL}" >> "$GITHUB_OUTPUT"

      # Build context is the repository root: each Dockerfile bind-mounts its own
      # tool's pyproject.toml and COPYs repo-relative paths, and the neighbouring
      # Dockerfile.dockerignore allowlist keeps everything else out.
      - name: Build architecture image locally
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ${{ steps.project.outputs.name }}/docker/Dockerfile
          platforms: ${{ matrix.platform }}
          pull: true
          load: true
          push: false
          provenance: false
          tags: ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          build-args: |
            APP_VERSION=${{ needs.meta.outputs.version }}
            GIT_SHA=${{ github.sha }}
            BUILD_DATE=${{ needs.meta.outputs.build_date }}
          cache-from: type=gha,scope=${{ matrix.tool }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.tool }}-${{ matrix.arch }}

      # Cheap but real: proves the `default` dependency group actually resolved
      # inside the image and that the entrypoint is present and executable. A
      # missing runtime dependency would otherwise only surface on the first
      # container start in production. The application itself is not imported,
      # because importing app.config has side effects and exits on absent
      # settings.
      - name: Smoke-test the image
        env:
          IMAGE: ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          TOOL: ${{ matrix.tool }}
        run: |
          set -euo pipefail
          case "$TOOL" in
            abuse-reporter)   imports="httpx, dns.resolver, geoip2.database" ;;
            metrics-exporter) imports="httpx, requests, urllib3" ;;
            *) echo "ERROR: no smoke-test imports defined for $TOOL"; exit 1 ;;
          esac
          docker run --rm --entrypoint python "$IMAGE" -c "import ${imports}; print('imports ok')"
          docker run --rm --entrypoint pip "$IMAGE" check
          docker run --rm --entrypoint test "$IMAGE" -x /app/entrypoint.sh
          echo "Reported version:"
          docker run --rm --entrypoint printenv "$IMAGE" APP_VERSION GIT_SHA

      # Blocking, like the docs scan: a vulnerable image must not reach Docker Hub.
      # Only findings with an available fix count (ignore-unfixed), so a rebuild on
      # a fresh base image clears them. Accepted exceptions belong in .trivyignore,
      # each with a reason. The scan runs before the push step on purpose.
      - name: Trivy scan
        id: trivy
        # Pinned to an immutable commit SHA, see GHSA-69fq-xp46-6x23.
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          cache: 'true'
          scan-type: 'image'
          image-ref: ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          format: 'json'
          output: 'trivy-${{ matrix.tool }}-${{ matrix.arch }}.json'
          exit-code: '1'
          ignore-unfixed: true
          # Lists every package, so a clean scan still proves which targets it covered.
          list-all-pkgs: true
          scanners: 'vuln'
          # See .trivyignore for findings accepted on purpose; each needs a reason.
          trivyignores: '.trivyignore'
          severity: 'CRITICAL,HIGH'
          timeout: '10m'

      # Proves the report is valid and covers OS and Python packages: an unreadable
      # report or a scan of nothing must not read as "0 findings". The scan step
      # above is what fails on findings; this one still lists them in the summary.
      - name: Summarize Trivy report
        if: ${{ !cancelled() && steps.trivy.conclusion != 'skipped' }}
        env:
          TOOL: ${{ matrix.tool }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          python3 .github/scripts/trivy_report.py status "trivy-${TOOL}-${ARCH}.json" \
            --expect-class os-pkgs --expect-class lang-pkgs \
            --summary-title "Trivy (${TOOL}, ${ARCH})" --list 20 >> "$GITHUB_STEP_SUMMARY"

      # Also on a failed scan, so the findings behind a red run stay inspectable.
      - name: Upload Trivy findings
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: trivy-${{ matrix.tool }}-${{ matrix.arch }}
          path: trivy-${{ matrix.tool }}-${{ matrix.arch }}.json
          retention-days: 14
          if-no-files-found: warn

      - name: Push tested image and record registry digest
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
          IMAGE_TAG: ${{ env.IMAGE_TAG }}
          PUSH_OUTPUT_FILE: ${{ runner.temp }}/docker-push-${{ matrix.tool }}-${{ matrix.arch }}.log
          DIGEST_FILE: digests/${{ matrix.tool }}-${{ matrix.arch }}
        run: |
          set -euo pipefail
          docker logout docker.io >/dev/null 2>&1 || true
          trap 'docker logout docker.io >/dev/null 2>&1 || true' EXIT
          printf '%s' "$DOCKERHUB_TOKEN" | docker login --username "$DOCKERHUB_USERNAME" --password-stdin
          docker push "$IMAGE_NAME:$IMAGE_TAG" | tee "$PUSH_OUTPUT_FILE"
          docker logout docker.io
          trap - EXIT
          python3 .github/scripts/release_tags.py record-pushed-digest

      - name: Upload digest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: digest-${{ matrix.tool }}-${{ matrix.arch }}
          path: digests/${{ matrix.tool }}-${{ matrix.arch }}
          retention-days: 30
          if-no-files-found: error

  manifest:
    name: Publish ${{ matrix.tool }} manifest
    needs: [meta, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: release
    strategy:
      fail-fast: false
      matrix:
        tool:
          - abuse-reporter
          - metrics-exporter
    env:
      IMAGE_NAME: ${{ format('{0}/crowdsec-toolbox', secrets.DOCKERHUB_USERNAME) }}
    steps:
      - name: Checkout job helper
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts
      # Before the banner: the helper scripts need the requires-python interpreter.
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.14'
      - name: Agent banner and job temp directory
        run: python3 .github/scripts/ci_job_setup.py

      - name: Download digests
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: digest-${{ matrix.tool }}-*
          path: digests/
          merge-multiple: true

      - name: Log in to Docker Hub
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # The public version and latest tags remain untouched until promotion.
      - name: Create and verify candidate manifest
        env:
          VERSION: ${{ needs.meta.outputs.version }}
          RUN_ID: ${{ github.run_id }}
          TOOL: ${{ matrix.tool }}
          DIGEST_DIR: digests
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
        run: python3 .github/scripts/release_tags.py create-candidate

  promote:
    name: Promote verified release manifests
    needs: [meta, manifest]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: release
    permissions:
      contents: read
    env:
      IMAGE_NAME: ${{ format('{0}/crowdsec-toolbox', secrets.DOCKERHUB_USERNAME) }}
    steps:
      - name: Checkout job helper
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts
      # Before the banner: the helper scripts need the requires-python interpreter.
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.14'
      - name: Agent banner and job temp directory
        run: python3 .github/scripts/ci_job_setup.py

      - name: Download build digests
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: digest-*
          path: digests/
          merge-multiple: true

      - name: Promote verified manifests
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          VERSION: ${{ needs.meta.outputs.version }}
          RUN_ID: ${{ github.run_id }}
          DIGEST_DIR: digests
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
          META_IS_NEWEST: ${{ needs.meta.outputs.is_newest }}
        run: python3 .github/scripts/release_tags.py promote

  cleanup:
    name: Remove ${{ matrix.tool }} arch fragment tags
    needs: [meta, manifest, promote]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: release
    strategy:
      fail-fast: false
      matrix:
        tool:
          - abuse-reporter
          - metrics-exporter
    steps:
      - name: Checkout job helper
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts
      # Before the banner: the helper scripts need the requires-python interpreter.
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.14'
      - name: Agent banner and job temp directory
        run: python3 .github/scripts/ci_job_setup.py

      # The per-architecture tags exist only so imagetools has immutable sources
      # to combine. Once the manifest is published and verified they are noise in
      # the Docker Hub tag list; the digests they pointed at stay referenced by
      # the manifest, so deleting the tags removes nothing real.
      - name: Delete architecture tags
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          VERSION: ${{ needs.meta.outputs.version }}
          RUN_ID: ${{ github.run_id }}
          TOOL: ${{ matrix.tool }}
        run: |
          set -euo pipefail
          hub_token="$(
            jq -nc --arg username "$DOCKERHUB_USERNAME" --arg password "$DOCKERHUB_TOKEN" \
              '{username: $username, password: $password}' \
            | curl -fsSL -H 'Content-Type: application/json' -d @- \
                'https://hub.docker.com/v2/users/login/' \
            | jq -r '.token // .access_token // empty'
          )"
          [[ -n "$hub_token" ]] || { echo "ERROR: failed to obtain a Docker Hub API token"; exit 1; }

          base="https://hub.docker.com/v2/namespaces/${DOCKERHUB_USERNAME}/repositories/crowdsec-toolbox/tags"
          for tag in "${TOOL}-${VERSION}-amd64" "${TOOL}-${VERSION}-arm64" \
            "${TOOL}-candidate-${RUN_ID}"; do
            status="$(curl -sS -o /dev/null -w '%{http_code}' -X DELETE \
              -H "Authorization: Bearer ${hub_token}" "${base}/${tag}")"
            case "$status" in
              204|202) echo "deleted ${tag}" ;;
              404)     echo "skipped ${tag} (not present)" ;;
              *)       echo "WARNING: deleting ${tag} returned HTTP ${status}" ;;
            esac
          done

  release:
    name: Create GitHub Release
    needs: [meta, promote, cleanup]
    # A verified promotion is what a release documents. Tag cleanup is cosmetic,
    # so a warning there must not suppress the notes - but a cancelled run must.
    # Without a status function GitHub adds an implicit success() over needs,
    # which a skipped dependency would not satisfy.
    if: >-
      !cancelled() &&
      needs.promote.result == 'success' &&
      needs.cleanup.result != 'cancelled'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: release
    permissions:
      contents: write
    env:
      IMAGE_NAME: ${{ format('{0}/crowdsec-toolbox', secrets.DOCKERHUB_USERNAME) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      # Before the banner: the helper scripts need the requires-python interpreter.
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.14'
      - name: Agent banner and job temp directory
        run: python3 .github/scripts/ci_job_setup.py

      # Mandatory: the notes embed the verdict of every scanned image, so a missing
      # report stops the release notes instead of being left out.
      - name: Download Trivy reports
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: trivy-*
          path: trivy-reports/
      # Appended to every release's notes as a rough size/composition signal.
      # Counts the checked-out tree at the release commit, not the whole
      # history, so it reflects exactly what this tag ships.
      - name: Run cloc
        env:
          CLOC_OUTPUT_FILE: ${{ runner.temp }}/cloc-output.txt
        run: |
          set -euo pipefail
          sudo apt-get update -qq && sudo apt-get install -y -qq cloc
          cloc . --hide-rate --exclude-dir=.git > "$CLOC_OUTPUT_FILE"
          cat "$CLOC_OUTPUT_FILE"

      - name: Build combined release notes
        env:
          VERSION: ${{ needs.meta.outputs.version }}
          CLOC_OUTPUT_FILE: ${{ runner.temp }}/cloc-output.txt
          RELEASE_NOTES_FILE: ${{ runner.temp }}/release-notes.md
        run: |
          set -euo pipefail
          trivy_args=()
          for tool in abuse-reporter metrics-exporter; do
            for arch in amd64 arm64; do
              trivy_args+=(--trivy-report "${tool}/${arch}=trivy-reports/trivy-${tool}-${arch}/trivy-${tool}-${arch}.json")
            done
          done
          python3 .github/scripts/release_notes.py \
            --version "$VERSION" \
            --abuse-changelog crowdsec-abuse-reporter/CHANGELOG.md \
            --metrics-changelog crowdsec-metrics-exporter/CHANGELOG.md \
            --cloc-file "$CLOC_OUTPUT_FILE" \
            "${trivy_args[@]}" \
            --output "$RELEASE_NOTES_FILE"

      - name: Create or update the release
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          VERSION: ${{ needs.meta.outputs.version }}
          RELEASE_NOTES_FILE: ${{ runner.temp }}/release-notes.md
        with:
          # RELEASE_TOKEN rather than the default token on purpose: a release
          # created with GITHUB_TOKEN does not emit a `release` event, so no
          # other workflow could ever react to a publish.
          github-token: ${{ secrets.RELEASE_TOKEN }}
          script: |
            const { publishRelease } = require('./.github/scripts/release_publish.cjs');
            await publishRelease({
              github,
              context,
              core,
              version: process.env.VERSION,
              releaseNotesFile: process.env.RELEASE_NOTES_FILE,
            });
