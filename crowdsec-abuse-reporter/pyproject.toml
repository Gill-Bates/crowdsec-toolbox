[project]
name = "crowdsec-abuse-reporter"
version = "1.0.4"
description = "CrowdSec bans to X-ARF abuse reports; at-most-once delivery with SQLite"
license = "MIT"
readme = "README.md"
requires-python = ">=3.14"
# Not a group: the shared logging and QuestDB client packages are real runtime dependencies of the distribution
# metadata. They come from tags of the private python-libraries repository, so installing it
# needs git and read access (no credentials belong in this file; see docs/development/setup.md).
# Installers that only read the `default` group must also install this list.
dependencies = [
    "gillbates-logging @ git+https://github.com/Gill-Bates/python-libraries.git@gillbates-logging-v0.1.0#subdirectory=packages/logging",
    "gillbates-questdb-client @ git+https://github.com/Gill-Bates/python-libraries.git@gillbates-questdb-client-v0.1.0#subdirectory=packages/questdb-client",
    "gillbates-shutdown-handler @ git+https://github.com/Gill-Bates/python-libraries.git@gillbates-shutdown-handler-v0.1.0#subdirectory=packages/shutdown-handler",
    "gillbates-smtp-client @ git+https://github.com/Gill-Bates/python-libraries.git@gillbates-smtp-client-v0.1.0#subdirectory=packages/smtp-client",
]

[dependency-groups]
# Runtime dependencies for abuse reporter
default = [
    "dnspython==2.9.2",
    "geoip2==5.4.0",
    "httpx==0.28.1",
]
# Development dependencies (testing, linting). Pinned on purpose: none of it ships in
# an image, so a ruff release that changes its rules must not fail CI on untouched code.
dev = [
    "jsonschema==4.26.0",
    "pytest==9.2.0",
    "ruff==0.17.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
# Shared baseline lives in the repository root; only tool-specific ignores stay here.
extend = "../ruff.toml"

[tool.ruff.lint.per-file-ignores]
# Assertions are the direct contract checks in pytest cases; tests poke private members
# and use fixed /tmp literals as inert test data.
"tests/*.py" = ["S101", "SLF001", "S108"]
# Console output is the job of these modules (banner, startup errors, status and dry-run views).
"app/config.py" = ["T201"]
"app/main.py" = ["T201"]
# The banner keeps ANSI colour codes as upper-case local constants.
"app/banner.py" = ["T201", "N806"]
# Placeholders are built from "?" only; every value is bound as a parameter.
"app/database.py" = ["S608"]
# Identifiers come from validated configuration and go through the quoting helpers.
"app/metrics.py" = ["S608"]
