services:
  crowdsec-abuse-reporter:
    image: giiibates/crowdsec-toolbox:abuse-reporter-latest
    container_name: crowdsec-abuse-reporter
    env_file:
      - ./settings.env
    restart: always
    stop_grace_period: 180s
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    read_only: true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    volumes:
      - ./data:/data
      - /etc/hostname:/run/host/hostname:ro
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m
      - /tmp/geoip:rw,noexec,nosuid,nodev,size=256m

networks:
  default:
    driver: bridge
