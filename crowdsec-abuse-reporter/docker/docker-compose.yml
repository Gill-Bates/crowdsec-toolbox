services:
  crowdsec-abuse-reporter:
    image: docker.cirrio.de/crowdsec-abuse-reporter:latest
    container_name: crowdsec-abuse-reporter
    env_file:
      - ./settings.env
    # tini is PID 1 inside the image (see Dockerfile ENTRYPOINT), so Compose adds no init of its own.
    # Continuous operation; a one-shot run must use
    # `docker compose run --rm -e RUN_ONCE=true crowdsec-abuse-reporter` (run creates the
    # container with restart "no"); RUN_ONCE=true under `up` would restart after every exit 0.
    restart: unless-stopped
    stop_grace_period: 180s
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    read_only: true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    volumes:
      - ./data:/data
      - /etc/hostname:/run/host/hostname:ro
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m
      - /tmp/geoip:rw,noexec,nosuid,nodev,size=256m

networks:
  default:
    driver: bridge
