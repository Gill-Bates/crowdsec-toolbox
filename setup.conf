# --- Squash Commit ---
# Squash-merge all commits into main, create a new tag, tag it as v<version> (version from the
# tools' pyproject.toml; both must declare the same version, see release.yml), and push the tag.
# Use as commit message "Release (<version>)". Then delete the feature branch locally and remotely.


# --- Last Minute Change ---
cd /opt/crowdsec-toolbox
VERSION="$(python3 -c 'import tomllib; print(tomllib.load(open("crowdsec-abuse-reporter/pyproject.toml","rb"))["project"]["version"])')"
VERSION_EXPORTER="$(python3 -c 'import tomllib; print(tomllib.load(open("crowdsec-metrics-exporter/pyproject.toml","rb"))["project"]["version"])')"
[ "$VERSION" = "$VERSION_EXPORTER" ] || { echo "Version mismatch: $VERSION vs $VERSION_EXPORTER" >&2; false; }
BRANCH="feature/v${VERSION}"

git checkout main && \
git merge --squash "$BRANCH" && \
git commit -m "Release (${VERSION})" && \
git tag "v$VERSION" && \
git push origin main && \
git push origin "v$VERSION" && \
git push origin --delete "$BRANCH" && \
git branch -D "$BRANCH"

# Published version tags are immutable. Correct release mistakes in a new version;
# never retag or force-push an existing release.

