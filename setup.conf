# --- Ruff & Pytest (the CI lint and test gates) ---
# Ruff discovers the shared root ruff.toml and each tool's pyproject.toml extension.
cd /opt/crowdsec-toolbox && \
source crowdsec-abuse-reporter/.venv/bin/activate && \
ruff check . && \
ruff format --check . && \
(cd crowdsec-abuse-reporter && python -m pytest) && \
deactivate && \
source crowdsec-metrics-exporter/.venv/bin/activate && \
(cd crowdsec-metrics-exporter && python -m pytest) && \
deactivate
