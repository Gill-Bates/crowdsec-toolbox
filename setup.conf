Unterteile zwischen "New", "Changed", "Fix" und "Security" (in dieser Reihenfolge). "New" Punkte immer als Erstes auflisten. "Changed" nimmt sichtbare Verhaltensänderungen bestehender Funktionen auf; sie gelangen über den Abschnitt der Version unverändert in die Release-Notes. Fokussiere Dich ausschliesslich auf funktionale Änderungen; Design-Änderungen und rein interne Arbeit (Refactorings, Tests) werden weggelassen.

