# =============================================================================
# CrowdSec Toolbox - Setup & Deployment Reference
# =============================================================================
# Reference of the commands for both tools, run block by block. This is not a
# script: do not `source` or `bash` the whole file, it contains push, release
# and cleanup commands. This is the only setup.conf in the repository; each tool
# keeps its own pyproject.toml.

# --- Local Development Setup (per tool) ---
# One venv per tool inside the tool directory (.venv/ is gitignored).
command -v python3.14 >/dev/null 2>&1 && PYTHON=python3.14 || PYTHON=python3

# crowdsec-abuse-reporter
$PYTHON -m venv /opt/crowdsec-toolbox/crowdsec-abuse-reporter/.venv
source /opt/crowdsec-toolbox/crowdsec-abuse-reporter/.venv/bin/activate
pip install --upgrade pip
pip install --group /opt/crowdsec-toolbox/crowdsec-abuse-reporter/pyproject.toml:default \
            --group /opt/crowdsec-toolbox/crowdsec-abuse-reporter/pyproject.toml:dev
# Shared logging package (private repo) from the local checkout; the pinned git tag in pyproject.toml
# is only used by CI and the Docker builds, which authenticate with a token.
pip install -e /opt/python-libraries/packages/logging
deactivate

# crowdsec-metrics-exporter
$PYTHON -m venv /opt/crowdsec-toolbox/crowdsec-metrics-exporter/.venv
source /opt/crowdsec-toolbox/crowdsec-metrics-exporter/.venv/bin/activate
pip install --upgrade pip
pip install --group /opt/crowdsec-toolbox/crowdsec-metrics-exporter/pyproject.toml:default \
            --group /opt/crowdsec-toolbox/crowdsec-metrics-exporter/pyproject.toml:dev
pip install -e /opt/python-libraries/packages/logging
deactivate

# --- Production venvs (hosts that run a tool outside Docker) ---
# The venv locations differ per tool on the production host.
apt install python3-pip python3.14-venv --no-install-recommends -y

# crowdsec-abuse-reporter
mkdir -p /opt/python/crowdsec_abuse_reporter
python3.14 -m venv /opt/python/crowdsec_abuse_reporter/.venv
source /opt/python/crowdsec_abuse_reporter/.venv/bin/activate
pip install --upgrade pip
pip install --group /opt/crowdsec-toolbox/crowdsec-abuse-reporter/pyproject.toml:default
pip install /opt/python-libraries/packages/logging
deactivate

# crowdsec-metrics-exporter (activated via bin/activate, not .venv/bin/activate)
python3.14 -m venv /opt/jobs/crowdsec_influx
source /opt/jobs/crowdsec_influx/bin/activate
pip install --upgrade pip
pip install --group /opt/crowdsec-toolbox/crowdsec-metrics-exporter/pyproject.toml:default
pip install /opt/python-libraries/packages/logging
deactivate

# --- Docker Login ---
docker login docker.cirrio.de
docker login  # Docker Hub

# --- Build & Push Images ---


# Build crowdsec-abuse-reporter
: "${PYTHON_LIBRARIES_TOKEN:?Missing PYTHON_LIBRARIES_TOKEN (see above)}" && \
PROJECT="crowdsec-abuse-reporter" && \
REGISTRY="docker.cirrio.de" && \
cd "/opt/crowdsec-toolbox" && \
VERSION="$(python3 -c 'import tomllib; print(tomllib.load(open("'"${PROJECT}"'/pyproject.toml", "rb"))["project"]["version"])')" && \
GIT_SHA="$(git rev-parse --verify HEAD)" && \
BUILD_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)" && \
docker buildx build \
  --platform linux/amd64 \
  --pull \
  -f "${PROJECT}/docker/Dockerfile" \
  --build-arg "APP_VERSION=$VERSION" \
  --build-arg "GIT_SHA=$GIT_SHA" \
  --build-arg "BUILD_DATE=$BUILD_DATE" \
  --secret id=python_libraries_token,env=PYTHON_LIBRARIES_TOKEN \
  -t "${REGISTRY}/${PROJECT}:${VERSION}" \
  -t "${REGISTRY}/${PROJECT}:latest" \
  --push \
  .

# Build crowdsec-metrics-exporter
: "${PYTHON_LIBRARIES_TOKEN:?Missing PYTHON_LIBRARIES_TOKEN (see above)}" && \
PROJECT="crowdsec-metrics-exporter" && \
REGISTRY="docker.cirrio.de" && \
cd "/opt/crowdsec-toolbox" && \
VERSION="$(python3 -c 'import tomllib; print(tomllib.load(open("'"${PROJECT}"'/pyproject.toml", "rb"))["project"]["version"])')" && \
GIT_SHA="$(git rev-parse --verify HEAD)" && \
BUILD_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)" && \
docker buildx build \
  --platform linux/amd64 \
  --pull \
  -f "${PROJECT}/docker/Dockerfile" \
  --build-arg "APP_VERSION=$VERSION" \
  --build-arg "GIT_SHA=$GIT_SHA" \
  --build-arg "BUILD_DATE=$BUILD_DATE" \
  --secret id=python_libraries_token,env=PYTHON_LIBRARIES_TOKEN \
  -t "${REGISTRY}/${PROJECT}:${VERSION}" \
  -t "${REGISTRY}/${PROJECT}:latest" \
  --push \
  .

# --- Deploy ---
docker compose down && docker compose pull && docker compose up -d

# --- Get API credentials from CrowdSec ---
docker exec -it crowdsec cat /etc/crowdsec/local_api_credentials.yaml

# --- Cleanup ---
docker system prune -af
docker buildx prune -af

