# =============================================================================
# CrowdSec Toolbox - Setup & Deployment Reference
# =============================================================================
# This file documents the build and deployment process for the toolbox.
# Each tool has its own pyproject.toml and setup.conf; see the directories below.

# --- Local Development Setup (per tool) ---

# crowdsec-abuse-reporter: install dependencies and set up venv
cd /opt/crowdsec-toolbox/crowdsec-abuse-reporter && bash setup.conf

# crowdsec-metrics-exporter: install dependencies and set up venv
cd /opt/crowdsec-toolbox/crowdsec-metrics-exporter && bash setup.conf

# --- Docker Login ---
docker login docker.cirrio.de
docker login  # Docker Hub

# --- Build & Push Images ---
# Each tool reads its version from its local pyproject.toml and generates BUILD_INFO.
# Run from the repository root.

# Build crowdsec-abuse-reporter
PROJECT="crowdsec-abuse-reporter" && \
cd /opt/crowdsec-toolbox && \
VERSION="$(python3 -c 'import tomllib; print(tomllib.load(open("'"${PROJECT}"'/pyproject.toml", "rb"))["project"]["version"])')" && \
GIT_SHA="$(git rev-parse --verify HEAD)" && \
BUILD_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)" && \
printf 'APP_VERSION=%s\nGIT_SHA=%s\nBUILD_DATE=%s\n' "$VERSION" "$GIT_SHA" "$BUILD_DATE" > "${PROJECT}/BUILD_INFO" && \
docker buildx build \
  --platform linux/amd64 \
  --pull \
  -f "${PROJECT}/docker/Dockerfile" \
  --build-arg APP_VERSION="$VERSION" \
  --build-arg GIT_SHA="$GIT_SHA" \
  --build-arg BUILD_DATE="$BUILD_DATE" \
  -t "docker.cirrio.de/${PROJECT}:latest" \
  --push .

# Build crowdsec-metrics-exporter
PROJECT="crowdsec-metrics-exporter" && \
cd /opt/crowdsec-toolbox && \
VERSION="$(python3 -c 'import tomllib; print(tomllib.load(open("'"${PROJECT}"'/pyproject.toml", "rb"))["project"]["version"])')" && \
GIT_SHA="$(git rev-parse --verify HEAD)" && \
BUILD_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)" && \
printf 'APP_VERSION=%s\nGIT_SHA=%s\nBUILD_DATE=%s\n' "$VERSION" "$GIT_SHA" "$BUILD_DATE" > "${PROJECT}/BUILD_INFO" && \
docker buildx build \
  --platform linux/amd64 \
  --pull \
  -f "${PROJECT}/docker/Dockerfile" \
  --build-arg APP_VERSION="$VERSION" \
  --build-arg GIT_SHA="$GIT_SHA" \
  --build-arg BUILD_DATE="$BUILD_DATE" \
  -t "docker.cirrio.de/${PROJECT}:latest" \
  --push .

# --- Deploy ---
docker compose down && docker compose pull && docker compose up -d

# --- Get API credentials from CrowdSec ---
docker exec -it crowdsec cat /etc/crowdsec/local_api_credentials.yaml

# --- Cleanup ---
docker system prune -af
docker buildx prune -af

# --- Release Checklist ---
# 1. Update CHANGELOG.md in each tool directory
# 2. Ensure documentation (README.md, AGENTS.md) reflects current state
# 3. Run tests: cd crowdsec-abuse-reporter && python -m pytest
# 4. Squash-merge feature branch to main
# 5. Create release tag: git tag -a v1.0.0 -m "Release v1.0.0"
# 6. Push tag: git push origin v1.0.0
# 7. Delete feature branch locally and remotely